# Dev environment: API with adb + Vite dev server, both with live reload.
#   docker compose -f docker-compose.dev.yml up --build
# UI: http://localhost:3223  API: http://localhost:5050
# Settings come from server/.env.example, overridden by server/.env (set ADMIN_PASSWORD there).

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./server/.env.example
      - path: ./server/.env
        required: false
    ports:
      - "5050:5050"
    volumes:
      - ./server:/app
      - /app/node_modules
      # The container has its own adb key; keep it so TVs only ask to allow debugging once
      - adb-keys:/root/.android
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    environment:
      API_URL: http://server:5050
    ports:
      - "3223:3223"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - server

volumes:
  adb-keys:
